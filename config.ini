# -------------------------
# Server Configuration
# -------------------------
[server]
bind = *
port = 8081
tls_cert =
acme_challenge =

# -------------------------
# Site Appearance & Behavior
# -------------------------
[site]
domain =
title = Réseau Mesh UMNG
message = Visualisation temps réel du réseau Meshtastic à Cajicá (UMNG)

nodes = True
conversations = True
everything = True
graphs = True
stats = True
net = True
map = True
top = True

# Map centrée sur Cajicá, Colombie
map_top_left_lat = 5.05
map_top_left_lon = -74.05
map_bottom_right_lat = 4.95
map_bottom_right_lon = -73.95

weekly_net_message = Check-in UMNG chaque mercredi à 18h. Format: (PRÉNOM) - (ZONE)
net_tag = #UMNGMeshNet

# -------------------------
# MQTT Broker Configuration
# -------------------------
[mqtt]
server = mosquitto
topics = ["msh/CO/cajica/#"]
port = 1883
username =
password =

# -------------------------
# Database Configuration
# -------------------------
[database]
connection_string = sqlite+aiosqlite:///packets.db
